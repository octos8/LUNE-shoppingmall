<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNE 쇼핑몰 - 취업용 포트폴리오</title>
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">

    <link rel="stylesheet" href="./css/list.css">
    
    <meta name="description" content="LUNE은 모던하고 감성적인 디자인을 제안하는 가구 라이프스타일 브랜드입니다. 소파, 테이블, 체어, 오피스 가구와 다양한 인테리어 컬렉션을 만나보세요.">
    <meta name="keywords" content="LUNE, 룬, 가구, 가구쇼핑몰, 인테리어, 디자인가구, 모던가구, 감성가구, 소파, 테이블, 의자, 오피스가구, 라이프스타일">
    <meta name="author" content="LUNE 쇼핑몰">
    <meta name="robots" content="index, follow">
    
    <!-- 검색엔진 대표 주소 -->
    <link rel="canonical" href="https://your-domain(나중에 수정).com/">
    <!-- Open Graph : 카카오톡, 페이스북 등 공유 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="LUNE 쇼핑몰">
    <meta property="og:title" content="LUNE 쇼핑몰 | 새로운 공간의 시작">
    <meta property="og:description" content="일상에 새로운 감각을 더하는 LUNE의 가구와 라이프스타일 컬렉션을 만나보세요.">
    <meta property="og:url" content="https://your-domain.com/">
    <meta property="og:image" content="https://your-domain.com/img/1.jpg">
    <meta property="og:local" content="ko_KR">
    
    <!-- 파비콘 -->
    <link rel="icon" type="image/png" href="./img/favicon.png">
    
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    
    <script src="./js/new-product.js"></script>
    <script src="./js/product-control-new.js" defer></script>
    
    <!-- 공통 header / footer 파일 연결 -->
    <script src="./js/include.js" defer></script>
    <script src="./js/header.js" defer></script>

</head>

<body>
    <div id="header-wrap">
        <!-- header.html 파일의 내용이 들어오는 영역 -->
    </div>
    <main>
        <div class="hero-banner">
            <a href="#">
                <picture>
                    <source media="(max-width:768px)" srcset="./img/banner-new-mo.jpg">
                    <source media="(max-width:1024px)" srcset="./img/banner-new-pad.jpg">
                    <img src="./img/banner-new-pc.jpg" alt="LUNE 쇼핑몰 신상품 배너">
                </picture>
            </a>
        </div>

        <section class="con1">
            <div class="common-frame">
                <div class="title">
                    <h1>NEW ARRIVALS</h1>
                    <span></span>
                    <p>새로운 디자인, 새로운 감각.</p>
                </div>
                <ul class="new-product grid-list">
                    <li>
                        <a href="#">
                            <figure>
                                <img src="./img/new1.jpg" alt="신제품1">
                            </figure>
                            <div class="sale-txt">
                                <h4 class="title-1">페블 라운드 스툴</h4>
                                <p class="desc-1">부드러운 패브릭과 낮은 등받이가 만드는 편안함.
                                    차분한 색감으로 거실에 자연스럽게 어우러집니다.</p>
                                <div class="pay-frame">
                                    <div class="pay-original">
                                        <span>100,000</span>원
                                    </div>
                                    <div class="pay-discount">
                                        <div class="discount">30%</div>
                                        <div class="pay"><b>70,000</b>원</div>
                                    </div>
                                </div>
                                <span class="like-badge noab"><img src="./img/heart-off.svg" alt="좋아요 하트">86</span>
                            </div>
                        </a>
                    </li>
            </div>
        </section>
    </main>
    <div id="footer-wrap">
        <!-- footer.html 파일의 내용이 들어오는 영역 -->
    </div>
</body>

</html>
